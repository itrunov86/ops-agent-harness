# agent-harness: per-machine config. Copy it to ~/.config/agent-harness/config.toml
# (or run `./harness init` — it will ask for the values) and run `./harness install`.
# There are no secrets here and there must not be: MCP server tokens live in their own configs or Keychain.

[org]
name = "Acme"                         # short organization name — shown in the header of the agent rules

[paths]
kb_root   = "~/work/docs"             # knowledge base: a git repository that is also the Obsidian vault
work_dir  = "~/work/chats"            # shared folder: all agent chats are opened from it
code_root = "~/work/git"              # optional: where work repositories live (for agent_bench)
reports_dir = "~/work/reports"        # agent_bench reports and other exports
state_dir = "~/.agents/state"         # internal hook state (chat bindings, autocommit)

[tracker]
prefixes   = ["OPS", "INC"]           # task key prefixes; hooks use them to recognize a task in a message
example    = "OPS-1234"
project    = "OPS"                    # where the agent creates an issue when there is no key
issue_type = "Task"
assignee   = "jdoe"                   # default assignee login
url        = "https://jira.example.com"

[wiki]
space = "OPS"                         # wiki space for on-call articles and postmortems

[chat]
url = "https://chat.example.com"      # for links to threads
alert_channels = ["alerts", "infra-alerts"]

[mcp]
hub = "sre-toolbox"                   # name of the main integrations MCP server; sre-toolbox ships with the harness (mcp/)

[agents]
claude = true                         # install skills, agents and hooks for Claude Code
codex  = true                         # ... and for Codex

[skills]
team = true                           # install team process templates from team-skills/
exclude = []                          # names of skills you don't need, e.g. ["yandex-cloud-devops"]

[hooks]
handoff_thresholds = [50, 75]         # context fill levels (%) at which to ask for a journal update
autocommit = true                     # commit the agent's edits in kb_root at the end of each response
kb_context = true                     # add documents found by task keys to the prompt
