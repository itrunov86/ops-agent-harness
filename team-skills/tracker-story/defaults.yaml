# Дефолты скилла tracker-story. Меняются обычным изменением репозитория, не в рантайме.
# Явные слова пользователя в чате важнее дефолта.

tracker:
  project_key: "{{TRACKER_PROJECT}}"
  issue_type: "{{TRACKER_ISSUE_TYPE}}"   # если в проекте нет Story — укажи доступный тип
  priority: "Medium"                     # пусто — не задавать, трекер поставит свой
  default_assignee: "{{TRACKER_ASSIGNEE}}"   # пусто — не назначать

  # Постоянные метки задач из этого скилла. Удобны для фильтров.
  # Последняя — маркер «задача в активном спринте», если команда так работает; иначе удали.
  labels:
    - "from-agent"
    - "planning"
    - "current_sprint"

  # Метка темы, настраивается: каждая задача получает ровно одну метку "<prefix><тема>".
  theme_label_prefix: "theme-"

  # Реестр тем (ключ без префикса → что входит). Заполни направлениями своей команды, например:
  #   monitoring: "Мониторинг и алертинг"
  #   cicd:       "Пайплайны и шаблоны деплоя"
  themes: {}

  # Поле связи задачи с эпиком, если инстанс использует custom field (customfield_NNNNN). Пусто — см. tracker-epic.
  epic_link_field: ""

wiki:
  # Необязательно: страница вики с таблицей тем для людей.
  themes_page_url: ""
  # Необязательно: ссылка, которая всегда попадает в раздел «Ссылки» (например, квартальный план).
  related_link: ""

# Метка спринта: sprint-{год}-w{ISO-неделя старта спринта}. Пусто — метку спринта не ставим.
#   reference_start — дата начала любого спринта (YYYY-MM-DD), якорь расчёта;
#   cadence_weeks   — длина спринта в неделях.
# Пример: reference_start=2026-01-05 (ISO w02), cadence_weeks=2, сегодня 2026-01-14 → sprint-2026-w02.
sprint:
  reference_start: ""
  cadence_weeks: 2

behavior:
  confirm_before_create: true        # черновик и явное подтверждение перед созданием
  link_to_epic_if_mentioned: true    # связать с эпиком, если пользователь его назвал
  min_plan_items: 3
  min_requirements: 3
  require_theme_label: true          # без метки темы задачу не создаём
