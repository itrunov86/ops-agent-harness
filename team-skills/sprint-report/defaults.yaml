# =============================================================================
#  Дефолты для скилла sprint-report
#
#  Меняется через PR. Обновляй quarterly_plan_page_id при смене квартала.
# =============================================================================

confluence:
  # Разводящая страница «Результаты спринтов» — родитель для всех страниц спринтов.
  sprint_hub_page_id: "<ID страницы спринтов>"

  # Страница текущего квартала — источник маппинга задач на квартальные цели.
  # Обновлять при переходе на новый квартал (Q3 2026 и т.д.)
  quarterly_plan_page_id: "<ID страницы квартального плана>"

  space: "{{WIKI_SPACE}}"

jira:
  project: "{{TRACKER_PROJECT}}"

# Параметры спринта — должны совпадать с jira-planning-story/defaults.yaml.
# Формула метки: sprint-{year}-w{isoweek} старта спринта.
sprint:
  reference_start: "2026-06-08"
  cadence_weeks: 2
