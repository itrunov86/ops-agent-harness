# =============================================================================
#  Дефолты для скилла quarterly-planning
#
#  Часть контракта команды. Меняется через PR.
#  Скилл читает значения отсюда, чтобы не спрашивать каждый раз
#  одно и то же. Если поле явно передано пользователем в чате,
#  оно перебивает дефолт.
# =============================================================================

confluence:
  # Space, в котором живёт роутер «Квартальное планирование» и страницы кварталов.
  space: "{{WIKI_SPACE}}"

  # Закладка-источник: страница-роутер «Квартальное планирование». На ней
  # макрос {children} перечисляет страницы кварталов. Имя должно совпадать
  # с ключом в confluence.bookmarks в config.yaml (см. ../../config.example.yaml).
  source_bookmark: "quarterly_planning"

  # Шаблон имени страницы квартала. Плейсхолдеры:
  #   {quarter} → 'Q1'..'Q4'
  #   {year}    → '2026'
  # Скилл создаст недостающую страницу с этим именем под source_bookmark.
  quarter_page_title: "{quarter} {year}"

# Поведение скилла
behavior:
  # Если true — перед каждой записью (Confluence или Jira) показывает превью
  # и просит пользователя подтвердить.
  confirm_before_create: true

  # Минимальные требования к качеству цели. Меньше — попроси дополнить.
  min_points_to_deliver: 3      # «Что появится к концу квартала»
  min_success_criteria: 2       # «Как поймём, что получилось»

# Делегирование Jira-части. Этот скилл управляет Confluence-стороной и
# постановкой цели. Создание эпика и подзадач делегирует другому скиллу,
# чтобы не дублировать настройки Jira (project, customfield'ы, лейблы).
delegate_jira_to: "jira-planning-epic"
