# =============================================================================
#  Дефолты для скилла contractor-report
#
#  Часть контракта команды. Меняется через PR.
# =============================================================================

contractor:
  name: "<подрядчик>"          # как подписывать страницу аналитики
  file_hint: "<подрядчик>"     # подстрока в имени Excel-файла в ~/Downloads
  syncs_to_jira: true           # подрядчик синхронизирует часы в Jira timespent

confluence:
  space: "{{WIKI_SPACE}}"

  # Родительская страница планирования работ подрядчика — под ней создаются
  # ежемесячные страницы аналитики.
  parent_page_id: "<ID страницы планирования работ подрядчика>"
  parent_page_url: "https://wiki.example.com/pages/<ID страницы планирования работ подрядчика>"

jira:
  base_url: "{{TRACKER_URL}}"
  # Проект Jira, где живут задачи подрядчика (реальные ключи в ссылках отчёта).
  project: "VND"

excel:
  # Ожидаемый формат файла: лист «Данные отчета», колонки:
  # Задача | Ссылка | Тип | Комментарий | Исполнитель | Время | Ставка | Сумма
  sheet_name: "Данные отчета"
  # Индексы колонок (0-based)
  col_task: 0
  col_link: 1
  col_type: 2
  col_comment: 3
  col_person: 4
  col_hours: 5

# Пороги для пометки задач подозрительными
thresholds:
  # Задача создана в Jira позже даты (день месяца): конец периода = подозрение
  retroactive_day: 25
  # Задача старше N месяцев от начала отчётного периода и всё ещё в Бэклоге
  old_backlog_months: 1
  # Задача с часами > N — всегда попадает в топ даже без аномалий
  top_task_hours: 8

# Нормализация имён: displayName из ворклогов Jira → имя в отчёте подрядчика.
people:
  name_norm:
    "Петров Иван": "Иван Петров"
    "": "Имя Фамилия"           # пустой displayName у аккаунта
  exclude: []                   # кого не показывать в дневной разбивке

# Catch-all задачи (буферы), которые исключаются из дневной разбивки.
buffer:
  keys: []                      # например ["VND-1370"]

behavior:
  # Показать превью и спросить подтверждение перед созданием страницы
  confirm_before_create: true
