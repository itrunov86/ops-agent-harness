# Дефолты скилла alerts-digest. Меняются обычным изменением репозитория, не в рантайме.

chat:
  # Команда / workspace в чате. Пусто — спросить пользователя или взять единственную доступную.
  team: ""
  # Алерт-каналы через запятую; по умолчанию дайджест строится по первому.
  channels: "{{ALERT_CHANNELS}}"

window:
  hours: 24        # окно анализа
  max_pages: 10    # предел пагинации (страницы по 200 сообщений)

# Парсер уведомлений. Подстрой под свой шаблон сообщений алертов.
parser:
  # Жирные поля, которые НЕ являются именем алерта.
  field_names:
    - "Severity"
    - "Cluster"
    - "Namespace"
    - "Instance"
    - "Description"
    - "Summary"
    - "Job"
    - "Service"
    - "Host"
    - "Resolved by"

  # Эмодзи → статус. Если в сообщении несколько — берётся первое по списку.
  status_emoji:
    ":red_circle:": "firing"
    ":rotating_light:": "firing"
    ":warning:": "warning"
    ":large_yellow_circle:": "warning"
    ":large_green_circle:": "resolved"
    ":white_check_mark:": "resolved"

  # Начало авто-сообщений о созданных тикетах (не алерты, считаются отдельно).
  ticket_markers:
    - "Создан тикет"
    - "Ticket created"

anomalies:
  flap_threshold: 4                        # повторов имени за окно
  unhealthy_namespace_distinct_alerts: 3   # разных имён в одном namespace
  burst_count: 5                           # алертов ...
  burst_minutes: 5                         # ... за столько минут

behavior:
  use_tables: true
  top_alerts_rows: 10
  top_namespaces_rows: 5
