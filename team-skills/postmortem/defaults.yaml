# =============================================================================
#  Дефолты для скилла postmortem
#
#  Часть контракта команды. Меняется через PR.
#  Скилл читает значения отсюда, чтобы не спрашивать каждый раз одно и то же.
#  Если поле явно передано пользователем в чате — оно перебивает дефолт.
# =============================================================================

confluence:
  # Space, в котором живёт раздел разборов инцидентов.
  space: "{{WIKI_SPACE}}"

  # Корневая страница-раздел «Разборы инцидентов». На ней макрос {children}
  # сам собирает список разборов. id известен; если страницы вдруг нет —
  # скилл создаёт её из templates/root_page.wiki под home_parent_id.
  root_page_id: "<ID раздела постмортемов>"
  root_page_title: "Разборы инцидентов (постмортемы)"

  # Домашняя страница space {{WIKI_SPACE}} — родитель для корневого раздела, если его
  # придётся создавать заново.
  home_parent_id: "<ID домашней страницы>"

  # Шаблон имени страницы разбора. Плейсхолдеры:
  #   {date} → дата инцидента в формате YYYY-MM-DD
  #   {slug} → короткое описание латиницей/кириллицей (например 'Отказ DNS в кластере')
  incident_title_pattern: "INC-{date} {slug}"

  # Стабильные командные страницы, на которые ссылается шаблон разбора.
  # Менять только если страницы переедут.
  related_pages:
    criticality: "<ID страницы «Критичность инцидента»>"   # Критичность инцидента (уровни Sev1..Sev4)
    sla: "<ID страницы «SLA и приоритизация»>"           # SLA и приоритизация (P1..P3, тайминги)
    oncall: "<ID страницы «Регламент дежурства»>"        # Регламент дежурства

jira:
  # Проект, в котором заводятся трекер инцидента и action items.
  project_key: "{{TRACKER_PROJECT}}"

  # Зонтичная задача-трекер инцидента. В {{TRACKER_PROJECT}} Story недоступна — Task.
  incident_issue_type: "Task"
  incident_priority: "High"
  incident_labels:
    - "from-claude"
    - "incident"
    - "postmortem"

  # Исполнитель трекера и action items по умолчанию (Jira username, не email).
  default_assignee: "{{TRACKER_ASSIGNEE}}"

  # Лейблы для action items (поверх лейблов из делегата jira-planning-story).
  action_item_labels:
    - "incident-followup"

# Поведение скилла
behavior:
  # Если true — перед каждой записью (Confluence или Jira) показывает превью
  # и просит подтвердить.
  confirm_before_create: true

  # Минимум action items в разборе. Разбор без единого действия — потраченное
  # время; если пользователь не назвал ни одного, попроси сформулировать хотя бы один.
  min_action_items: 1

# Action items заводятся как отдельные Jira-задачи через этот скилл —
# чтобы не дублировать шаблон тела задачи и настройки проекта.
delegate_action_items_to: "jira-planning-story"
