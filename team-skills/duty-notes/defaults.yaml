# Дефолты скилла duty-notes. Меняются обычным изменением репозитория, не в рантайме.

wiki:
  # Пространство вики для статей дежурства.
  space: "{{WIKI_SPACE}}"

  # Страница-оглавление раздела статей: родитель новых статей и таблица ссылок на них.
  # Заполни id и URL своей страницы; пусто — скилл спросит пользователя.
  index_page_id: ""
  index_page_url: ""

  # Шапка таблицы на странице-оглавлении, в которую добавляется строка о новой статье.
  index_table_header: "|| Статья || Описание ||"

  # Необязательно: страница с регламентом дежурств для ссылок из статей.
  duty_page_url: ""

behavior:
  # Показывать черновик и ждать явного подтверждения перед созданием страницы.
  confirm_before_create: true

  # После создания статьи добавлять строку в таблицу оглавления.
  update_index_on_create: true
