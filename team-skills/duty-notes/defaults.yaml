# =============================================================================
#  Дефолты для скилла duty-notes
#
#  Часть контракта команды. Меняется через PR.
#  Скилл читает значения отсюда, чтобы не спрашивать каждый раз одно и то же.
# =============================================================================

confluence:
  space: "{{WIKI_SPACE}}"

  # Разводящая страница «Статьи и Решение проблем» — сюда добавляются ссылки
  # на новые статьи и под ней создаются дочерние страницы.
  index_page_id: "<ID страницы-оглавления>"

  # Родительская страница «Дежурства» — для контекстных ссылок в статьях.
  duty_page_id: "<ID страницы дежурств>"

  # URL разводящей страницы (для ссылок внутри статей).
  index_page_url: "https://wiki.example.com/pages/<ID страницы-оглавления>"

  # URL страницы «Дежурства» (для ссылок внутри статей).
  duty_page_url: "https://wiki.example.com/pages/<ID страницы дежурств>"

# Поведение скилла
behavior:
  # Показывать превью статьи перед созданием и просить подтверждение.
  confirm_before_create: true

  # После создания статьи — обновлять таблицу «Статьи» на разводящей странице.
  update_index_on_create: true
